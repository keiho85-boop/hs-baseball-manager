# Androidアプリ（Capacitor）を自動で作る
# ・main に変更が入るたびに、試しに入れられる APK（デバッグ版）を作る
# ・Secrets に署名の鍵が登録してあれば、Google Play に出す AAB（リリース版）も作る
#   必要な Secrets：KEYSTORE_BASE64（鍵ファイルをbase64にしたもの）、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync android
      - name: デバッグ版 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hsbm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: 署名の鍵を用意
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: リリース版 AAB
        if: steps.key.outputs.file != ''
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.file != ''
        with:
          name: hsbm-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
